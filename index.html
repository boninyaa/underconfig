<!doctype html>
<html lang="en">
  <head>
    <meta name="darkreader-lock" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>underconfig!</title>
    <meta name="description" content="straight-forward, fast tf2 configurator with just a .cfg file!">
    <link rel="icon" type="image/png" href="assets/uconf-logo.png" />
    <link rel="stylesheet" href="layout-a.css" />
    <link rel="stylesheet" href="layout-b.css" />
  </head>
  <body>
    <header class="heading-container">
      <div class="heading">
        <img src="assets/uconf-logo.png" class="ulogo nodrag" draggable="false" />
        <div class="htext">
          <h1 class="uconf-title">underconfig!</h1>
          <p class="uconf-desc">straight-forward, fast tf2 configurator with just a .cfg file!</p>
          <span class="uconf-author">made with ♥ by <a href="https://boni.moe/" target="_blank" rel="noopener noreferrer">bonibon</a> | read the <a href="faq/index.html">faq!</a></span>
        </div>
      </div>
    </header>

    <main class="app-layout">
      <section class="adjustments">
        <div class="panelactions">
          <button type="button" id="btn-min" class="btn-action">set absolute min</button>
          <button type="button" id="btn-max" class="btn-action">set absolute max</button>
        </div>

        <div id="controls-container" class="controls-container"></div>
      </section>

      <section class="outputpanel">
        <div class="output-header">
          <span class="output-title">output</span>
          <div class="output-actions">
            <button type="button" id="btn-down" class="btn-down">
              <img src="assets/down.svg" class="btn-icon" draggable="false" />
              autoexec.cfg
            </button>
            <button type="button" id="btn-copy" class="btn-copy">copy!</button>
          </div>
        </div>
        <pre class="codeblock"><code id="cfg-output"></code></pre>
      </section>
    </main>

    <script src="generator.js"></script>
  </body>
</html>
