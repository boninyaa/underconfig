con_enable 1; sv_cheats 1; sv_allow_point_servercommand always; fov_desired 90
// ..........................................................

// ~ graphics ~
// motion blur: none
mat_motion_blur_enabled 0

// shadows: medium
r_shadows 1
r_shadowrendertotexture 1
cl_blobbyshadows 0
r_shadowmaxrendered 11
nb_shadow_dist -1

// effects: medium
cl_show_splashes 0
tf_impactwatertimeenable 1
cl_blobbyshadows 1
fx_drawimpactdebris 1
fx_drawimpactdust 1
fx_drawmetalspark 1
r_drawflecks 1
cl_ejectbrass 0
cl_muzzleflash_dlight_1st 0
muzzleflash_light 0
cl_fasttempentcollision 10
cl_particle_batch_mode 1
tf_particles_disable_weather 1
mat_reduceparticles 1
cl_drawmonitors 0
tf_monitor_resolution 32

// textures: high
mat_picmip -1

// anti-aliasing: none
mat_alphacoverage 0
mat_antialias 1

// texture filtering: high
mat_filterlightmaps 1
mat_filtertextures 1
mat_forceaniso 4
mat_trilinear 1

// level of detail: medium
r_rootlod 1
r_lod -1
r_staticprop_lod -1

// lighting: low
r_ambientboost 0
r_lightaverage 0
r_dynamic 0
r_maxdlights 0
r_worldlightmin 999999
r_worldlights 0
mat_disable_lightwarp 1
r_pixelvisibility_partial 0
r_lightcache_zbuffercache 1

// gibs and silly gibs: normal+silly
violence_hgibs 0
violence_agibs 0
violence_ablood 0
violence_hblood 0
cl_burninggibs 1
tf_playergib 1
props_break_max_pieces -1

// sheen tint: normal
tf_sheen_alpha_firstperson 0.5

// sheen speed: normal
tf_sheen_framerate 25

// vsync: disabled
mat_vsync 0

// phong: disabled
mat_phong 0
r_rimlight 0

// props: disabled
r_decalstaticprops 0
cl_phys_props_enable 0
r_propsmaxdist 0
lod_TransitionDist -1
r_drawdetailprops 0
cl_detailfade 0
cl_detaildist 1

// ragdolls: enabled
cl_ragdoll_fade_time 10
cl_ragdoll_forcefade 0
cl_ragdoll_physics_enable 1
cl_ragdoll_collide 1
ragdoll_sleepaftertime 1.5

// jigglebones: enabled
cl_jiggle_bone_framerate_cutoff 67

// ropes: disabled
r_drawropes 0
rope_rendersolid 0
r_ropetranslucent 0
rope_smooth 0
rope_subdiv 0
rope_collide 0
rope_wind_dist 0

// 3D sky: enabled
r_3dsky 1

// misc visuals: disabled
pyro_dof 0
pyro_vignette 0
tf_romevision_opt_in 0

// ~ network ~
// interpolation patch: enabled
cl_cmdrate 66
cl_updaterate 66
cl_interp 0
cl_interp_ratio 1

// ~ misc ~
// CPU threading: auto
mat_queue_mode -1

// gamma: default
mat_monitorgamma 2

// auto-record matches: disabled
ds_enable 0

// null-cancelling movement: enabled
bind w +mfwd
bind s +mback
bind a +mleft
bind d +mright
alias +mfwd "-back;+forward;alias checkfwd +forward"
alias +mback "-forward;+back;alias checkback +back"
alias +mleft "-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "-moveleft;+moveright;alias checkright +moveright"
alias -mfwd "-forward;checkback;alias checkfwd none"
alias -mback "-back;checkfwd;alias checkback none"
alias -mleft "-moveleft;checkright;alias checkleft none"
alias -mright "-moveright;checkleft;alias checkright none"
alias checkfwd none
alias checkback none
alias checkleft none
alias checkright none
alias none ""

// hitsounds: enabled
tf_dingalingaling 1

// killsounds: enabled
tf_dingalingaling_lasthit 1

// contracker progress UI: disabled
tf_contract_progress_show 0

// show graph: enabled
net_graph 1

// quick weapon swap: enabled
hud_fastswitch 1

// hud player model: disabled
cl_hud_playerclass_use_playermodel 0

