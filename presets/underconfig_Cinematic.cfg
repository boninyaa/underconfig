con_enable 1; sv_cheats 1; sv_allow_point_servercommand always; fov_desired 90
// ..........................................................

// ~ graphics ~
// motion blur: none
mat_motion_blur_enabled 0

// shadows: high+
r_shadows 1
r_shadowrendertotexture 1
cl_blobbyshadows 0
r_shadowmaxrendered 160
nb_shadow_dist 8192

// effects: high+
cl_show_splashes 1
tf_impactwatertimeenable 1
cl_blobbyshadows 1
fx_drawimpactdebris 1
fx_drawimpactdust 1
fx_drawmetalspark 1
r_drawflecks 1
cl_ejectbrass 1
cl_muzzleflash_dlight_1st 1
muzzleflash_light 0
cl_fasttempentcollision 10
cl_particle_batch_mode 1
tf_particles_disable_weather 0
mat_reduceparticles 1
cl_drawmonitors 1
tf_monitor_resolution 1024

// textures: high+
mat_picmip -10

// anti-aliasing: 8x
mat_alphacoverage 1
mat_antialias 8

// texture filtering: high++
mat_filterlightmaps 1
mat_filtertextures 1
mat_forceaniso 16
mat_trilinear 1

// level of detail: high+
r_rootlod 0
r_lod 0
r_staticprop_lod 0

// lighting: high+
r_ambientboost 1
r_lightaverage 1
r_dynamic 1
r_maxdlights 32
r_worldlightmin 0.000001
r_worldlights 4
mat_disable_lightwarp 0
r_pixelvisibility_partial 1
r_lightcache_zbuffercache 0

// gibs and silly gibs: normal+silly
violence_hgibs 0
violence_agibs 0
violence_ablood 0
violence_hblood 0
cl_burninggibs 1
tf_playergib 1
props_break_max_pieces -1

// sheen tint: normal
tf_sheen_alpha_firstperson 0.5

// sheen speed: normal
tf_sheen_framerate 25

// vsync: disabled
mat_vsync 0

// phong: enabled
mat_phong 1
r_rimlight 1

// props: enabled
r_decalstaticprops 1
cl_phys_props_enable 1
r_propsmaxdist 500
lod_TransitionDist -5000
r_drawdetailprops 0
cl_phys_props_respawndist 500
cl_phys_props_respawnrate 120
cl_phys_props_max 15
cl_detailfade 0
cl_detaildist 1200

// ragdolls: enabled
cl_ragdoll_fade_time 10
cl_ragdoll_forcefade 0
cl_ragdoll_physics_enable 1
cl_ragdoll_collide 1
ragdoll_sleepaftertime 1.5

// jigglebones: enabled
cl_jiggle_bone_framerate_cutoff 67

// ropes: enabled
r_drawropes 1
rope_rendersolid 1
r_ropetranslucent 0
rope_smooth 1
rope_subdiv 1
rope_collide 0
rope_wind_dist 0

// 3D sky: enabled
r_3dsky 1

// misc visuals: enabled
pyro_dof 1
pyro_vignette 1
tf_romevision_opt_in 1


// ~ network ~
// interpolation patch: enabled
cl_cmdrate 66
cl_updaterate 66
cl_interp 0
cl_interp_ratio 1

// ~ misc ~
// CPU threading: auto
mat_queue_mode -1

// gamma: default
mat_monitorgamma 2

// auto-record matches: disabled
ds_enable 0

// null-cancelling movement: enabled
bind w +mfwd
bind s +mback
bind a +mleft
bind d +mright
alias +mfwd "-back;+forward;alias checkfwd +forward"
alias +mback "-forward;+back;alias checkback +back"
alias +mleft "-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "-moveleft;+moveright;alias checkright +moveright"
alias -mfwd "-forward;checkback;alias checkfwd none"
alias -mback "-back;checkfwd;alias checkback none"
alias -mleft "-moveleft;checkright;alias checkleft none"
alias -mright "-moveright;checkleft;alias checkright none"
alias checkfwd none
alias checkback none
alias checkleft none
alias checkright none
alias none ""

// hitsounds: enabled
tf_dingalingaling 1

// killsounds: enabled
tf_dingalingaling_lasthit 1

// contracker progress UI: disabled
tf_contract_progress_show 0

// show graph: enabled
net_graph 1

// quick weapon swap: enabled
hud_fastswitch 1

// hud player model: enabled
cl_hud_playerclass_use_playermodel 1

